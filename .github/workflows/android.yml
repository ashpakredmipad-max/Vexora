name: Build Vexora APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix timeline add behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/vexora/editor/EditorView.kt')
          s = p.read_text()
          old = 'if (y in 610f..730f && x in 200f..850f) { action("add"); return true }'
          new = 'if (y in 610f..730f && x in 400f..445f) { action("add"); return true }'
          if old in s:
              s = s.replace(old, new, 1)
          old_draw = 'round(c, 788f, 623f, 840f, 715f, 2f, panel2)\n        line(c, 815f, 646f, 815f, 691f, white, 2f); line(c, 793f, 668f, 837f, 668f, white, 2f)'
          if old_draw in s:
              s = s.replace(old_draw, '', 1)
          p.write_text(s)

      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/vexora/editor/EditorView.kt
            git commit -m "Fix timeline add button behavior"
            git push
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vexora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
